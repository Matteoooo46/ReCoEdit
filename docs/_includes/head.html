<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2e86ab">

<link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/js/lity.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/recoedit.css' | relative_url }}">

{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}
<title>{{ page_title }}{% unless page_title == site.title %} · {{ site.title }}{% endunless %}</title>
<meta name="description" content="{{ page_description | escape }}">
<meta name="keywords" content="{{ site.global_tags | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ page_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title | escape }}">
<meta name="twitter:description" content="{{ page_description | escape }}">
