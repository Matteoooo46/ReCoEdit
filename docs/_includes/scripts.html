<script>
  (function () {
    var toggle = document.getElementById('menuToggle');
    if (!toggle) return;
    toggle.addEventListener('click', function () {
      toggle.setAttribute('aria-expanded', toggle.classList.contains('open') ? 'true' : 'false');
    });
  }());
</script>
