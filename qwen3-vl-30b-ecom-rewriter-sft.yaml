# ==========================================
# 1. 模型路径与模板 (核心修改区)
# ==========================================
# Qwen3-VL-30B-A3B-Instruct — 与推理脚本中使用的 VLM 完全一致
# 30B MoE (3B activated), 训练时全量加载 30B 权重进行 LoRA 微调
model_name_or_path: /data/phd/kousiqi/zhitao/models/Qwen3-VL-30B-A3B-Instruct

# Qwen3-VL 专属模板（与推理脚本中 Qwen3-VL 系列对应）
template: qwen3_vl_nothink

# ==========================================
# 2. 训练阶段与方式
# ==========================================
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

# ==========================================
# 3. 数据集配置
# ==========================================
# 电商商品图编辑 prompt 改写数据集 — 使用与推理脚本相同的 system prompt
# system prompt 来源: qwen_image_edit_2511_inference_apg.py 中的 PROMPT_REWRITE_SYSTEM
dataset_dir: /data/phd/kousiqi/zhitao/LlamaFactory/data
dataset: my_qwen_ecom_rewriter_data
cutoff_len: 4096
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 4

# ==========================================
# 4. 输出路径与保存策略
# ==========================================
output_dir: /data/phd/kousiqi/zhitao/qwen3-vl-30b-ecom-rewriter-sft
logging_steps: 10
save_steps: 1000
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true

# ==========================================
# 5. 训练超参数 (硬件相关)
# ==========================================
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

# ==========================================
# 6. 验证集评估
# ==========================================
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
